name: Task
description: A unit of work an agent or human can pick up.
title: "[area] short imperative summary"
labels: ["type:feat"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, decide whether this is finishable **headlessly**. If yes, the acceptance
        criteria below must be checkable by running a command. If it needs the Editor GUI, say so
        and label it `agent:assisted` or `agent:blocked-on-gui`.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true afterwards that is not true now.
    validations:
      required: true

  - type: input
    id: spec
    attributes:
      label: Spec reference
      description: Section of docs/DESIGN.md this implements, e.g. "§5.3 calibration drift".
      placeholder: "§"

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        How anyone verifies this is done. Prefer commands and observable outputs over
        "looks right". If a step needs eyes, mark it (GUI).
      value: |
        - [ ]
        - [ ] Both compile checks pass
        - [ ] `ChemistryTests` green (if chemistry/content touched)
        - [ ] `.meta` files committed for any new assets
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Constraints and gotchas
      description: >
        Hard rules this touches, files that only one PR may edit at a time (scenes, prefabs),
        prior art in the codebase.

  - type: dropdown
    id: agentable
    attributes:
      label: Can an agent finish this alone?
      options:
        - "Yes — fully headless"
        - "Mostly — one GUI step at the end"
        - "No — needs the Editor throughout"
    validations:
      required: true
